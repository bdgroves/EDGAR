name: EDGAR Probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pybaseball requests pandas
      - run: python tools/probe.py
      - run: |
          git config user.name "edgar-bot"
          git config user.email "edgar-bot@users.noreply.github.com"
          git checkout --orphan probe-out
          git rm -rq --cached .
          git add -f tools/probe_out.json
          git commit -qm "probe output"
          git push -f origin probe-out
